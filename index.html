<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>데이트 신청 💌</title>
<meta property="og:title" content="나랑 데이트 할래? 💕" />
<meta property="og:description" content="YES를 눌러줘 (NO는... 도망갈걸?)" />
<style>
  /* ===== 기본/리셋 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root{
    --pink:  #ff3d6e;
    --pink2: #ff7aa2;
    --grey:  #9aa4b2;
    --grey2: #6b7280;
    --card:  rgba(255,255,255,.86);
    --ink:   #3a2b33;
  }
  html, body { height: 100%; }
  body{
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    color: var(--ink);
    min-height: 100dvh;
    /* 가로 스크롤만 차단하고 세로는 허용 → 내용이 길어지면(날짜 화면) 스크롤 가능 */
    overflow-x: hidden;
    background: linear-gradient(135deg,#ffd3e0 0%, #ffe3ec 40%, #fbd7ff 100%);
    background-size: 200% 200%;
    animation: bgshift 14s ease infinite;
    display: flex; justify-content: center;
    padding: 20px 12px;
    position: relative;
  }
  /* overflow-x/overflow-y 를 각각 지정하면 브라우저가 나머지 축을 auto 로 처리 */
  @keyframes bgshift{
    0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%}
  }

  /* ===== 배경에 둥둥 뜨는 하트 ===== */
  .hearts{ position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .hearts span{
    position: absolute; bottom: -40px; font-size: 22px; opacity: .6;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{ transform: translateY(0) rotate(0); opacity: 0; }
    10%{ opacity: .7; }
    100%{ transform: translateY(-115dvh) rotate(360deg); opacity: 0; }
  }

  /* ===== 우중충 무드 오버레이 =====
     거절당할수록 opacity가 올라가 화면이 어두워지고, YES를 누르면 서서히 화사하게 회복 */
  .gloom{
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: linear-gradient(180deg, rgba(45,55,90,.95), rgba(70,60,95,.9));
    opacity: 0; transition: opacity 1.2s ease;
  }

  /* ===== 카드/화면 ===== */
  /* margin:auto → 화면이 짧으면 상하 가운데 정렬, 내용이 뷰포트보다 길면
     자동으로 위 정렬로 바뀌어 스크롤로 끝까지 볼 수 있음(플렉스 잘림 방지) */
  .stage{ position: relative; z-index: 1; width: min(92vw, 460px); margin: auto; }
  .screen{
    display: none;
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.6);
    border-radius: 28px;
    padding: 38px 26px 32px;
    box-shadow: 0 24px 60px rgba(255,61,110,.22);
    text-align: center;
    animation: pop .45s cubic-bezier(.2,.9,.3,1.3);
  }
  .screen.active{ display: block; }
  @keyframes pop{ from{ transform: scale(.9); opacity: 0 } to{ transform: scale(1); opacity: 1 } }

  .emoji-lg{ font-size: 56px; line-height: 1; margin-bottom: 10px; display:block; animation: beat 1.1s ease-in-out infinite; }
  /* 텍스트 이모지 대신 이미지가 들어갈 때: 글자 크기에 맞춰 높이 통일 */
  .emoji-lg img{
    height: 1.35em; width: auto; max-width: 100%;
    display: inline-block; vertical-align: bottom;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,.15));
  }
  @keyframes beat{ 0%,100%{transform:scale(1)} 15%{transform:scale(1.18)} 30%{transform:scale(1)} 45%{transform:scale(1.12)} }

  h1{ font-size: 26px; font-weight: 800; letter-spacing:-.02em; line-height: 1.35; margin-bottom: 8px; }
  .sub{ font-size: 14px; color:#8a7480; margin-bottom: 26px; min-height: 20px; transition: color .2s; }

  /* ===== 버튼 ===== */
  .btn-row{ display: flex; gap: 14px; justify-content: center; align-items: center; flex-wrap: wrap; }
  button{ font-family: inherit; cursor: pointer; border: none; }

  .btn{
    font-size: 18px; font-weight: 800; color: #fff;
    padding: 15px 30px; border-radius: 999px;
    transition: transform .12s ease, box-shadow .2s ease;
  }
  .btn:active{ transform: scale(.96); }

  .btn-yes{
    background: linear-gradient(135deg, var(--pink2), var(--pink));
    box-shadow: 0 10px 24px rgba(255,61,110,.45);
    transform-origin: center;
  }
  .btn-yes:hover{ box-shadow: 0 14px 30px rgba(255,61,110,.6); }

  .btn-no{
    background: linear-gradient(135deg, var(--grey), var(--grey2));
    box-shadow: 0 8px 18px rgba(107,114,128,.35);
    will-change: left, top, transform;
  }

  .btn-ghost{
    background: transparent; color:#b08; font-weight:700; font-size:14px;
    padding: 10px; margin-top: 14px; opacity:.7;
  }
  .btn-ghost:hover{ opacity:1; }

  /* ===== 날짜 선택 화면 ===== */
  .field{ text-align: left; margin: 14px 2px; }
  .field > label{ display:block; font-size: 13px; font-weight:700; color:#8a7480; margin-bottom: 8px; }
  input[type="date"], input[type="time"], input[type="text"]{
    width: 100%; font-family: inherit; font-size: 16px; color: var(--ink);
    padding: 13px 14px; border-radius: 14px; border: 2px solid #ffd0dd;
    background: #fff; outline: none; transition: border-color .2s;
  }
  input:focus{ border-color: var(--pink); }

  .chips{ display:flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .chip{
    font-size: 13px; font-weight: 700; color: #b04a68;
    background:#fff0f5; border: 1.5px solid #ffd0dd; border-radius: 999px;
    padding: 8px 14px;
  }
  .chip.on{ background: var(--pink); color:#fff; border-color: var(--pink); }
  .chip:active{ transform: scale(.95); }

  /* ===== 완료 화면 ===== */
  .ticket{
    background: linear-gradient(135deg,#fff, #fff5f8);
    border: 2px dashed #ffb3c8; border-radius: 20px;
    padding: 20px; margin: 8px 0 22px; text-align: left;
  }
  .ticket .row{ display:flex; align-items:center; gap:10px; padding: 7px 0; font-size: 16px; }
  .ticket .row b{ color: var(--pink); min-width: 52px; }
  .ticket .big{ font-size: 20px; font-weight: 800; text-align:center; margin-bottom: 6px; }

  .share-btn{
    width: 100%; font-size: 17px; font-weight: 800; color:#3c1e00;
    background: #FEE500; /* 카카오 옐로우 */
    padding: 15px; border-radius: 14px; margin-top: 4px;
    box-shadow: 0 8px 20px rgba(254,229,0,.5);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .share-btn:active{ transform: scale(.98); }

  /* ===== 토스트 ===== */
  .toast{
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    background: rgba(40,20,30,.92); color:#fff; font-size:14px; font-weight:600;
    padding: 12px 20px; border-radius: 999px; z-index: 10000;
    opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s;
    max-width: 88vw; text-align:center;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  .fine{ font-size: 11px; color:#b199a4; margin-top: 12px; }

  /* 탭 지연 제거 (모바일에서 버튼 반응 빠르게) */
  button{ touch-action: manipulation; }

  /* 세로가 짧은 폰: 여백을 줄여 한 화면에 최대한 담기 */
  @media (max-height: 720px){
    .screen{ padding: 26px 22px 24px; border-radius: 22px; }
    .emoji-lg{ font-size: 46px; }
    h1{ font-size: 23px; }
    .sub{ margin-bottom: 18px; }
    .field{ margin: 10px 2px; }
  }
</style>
</head>
<body>
  <!-- 배경 하트 (JS로 채움) -->
  <div class="hearts" id="hearts" aria-hidden="true"></div>
  <!-- 거절당할수록 어두워지는 무드 레이어 -->
  <div class="gloom" id="gloom" aria-hidden="true"></div>

  <div class="stage">
    <!-- ① 신청 화면 -->
    <section class="screen active" id="screen-ask">
      <span class="emoji-lg">🥺</span>
      <h1 id="q-title">우리… 데이트 할래?</h1>
      <p class="sub" id="taunt">둘 중 하나만 눌러줘 👀</p>
      <div class="btn-row" id="askRow">
        <button class="btn btn-yes" id="yesBtn">YES 💕</button>
        <button class="btn btn-no" id="noBtn">NO</button>
      </div>
    </section>

    <!-- ② 날짜/장소 선택 화면 -->
    <section class="screen" id="screen-date">
      <span class="emoji-lg">🗓️</span>
      <h1>좋았어! 언제 만날까? </h1>
      <p class="sub">우리 데이트 날을 정해보자 💫</p>

      <div class="field">
        <label>📅 날짜</label>
        <div class="chips" id="dateChips">
          <button class="chip" data-day="0">오늘</button>
          <button class="chip" data-day="sat">이번 주말</button>
          <button class="chip" data-day="sat2">다음 주말</button>
        </div>
        <input type="date" id="dateInput" style="margin-top:10px" />
      </div>

      <div class="field">
        <label>⏰ 시간</label>
        <div class="chips" id="timeChips">
          <button class="chip" data-time="11:00">점심 ☀️</button>
          <button class="chip" data-time="14:00">오후 🌤️</button>
          <button class="chip" data-time="18:30">저녁 🌙</button>
        </div>
        <input type="time" id="timeInput" style="margin-top:10px" />
      </div>

      <div class="field">
        <label>📍 어디서 만날까?</label>
        <div class="chips" id="placeChips">
          <button class="chip" data-place="분위기 좋은 카페 ☕">카페</button>
          <button class="chip" data-place="영화관 🎬">영화</button>
          <button class="chip" data-place="맛집 탐방 🍝">맛집</button>
          <button class="chip" data-place="한강 산책 🌊">한강</button>
        </div>
        <input type="text" id="placeInput" placeholder="직접 입력해도 좋아요" style="margin-top:10px" />
      </div>

      <button class="btn btn-yes" id="confirmBtn" style="width:100%; margin-top:8px">이 날로 확정! 💘</button>
    </section>

    <!-- ③ 완료/공유 화면 -->
    <section class="screen" id="screen-done">
      <span class="emoji-lg">💖</span>
      <h1>데이트 확정!</h1>
      <p class="sub">우리 여기서 만나자 🥰</p>

      <div class="ticket" id="ticket">
        <div class="big">💌 DATE TICKET 💌</div>
        <div class="row"><b>📅 날짜</b><span id="tDate">-</span></div>
        <div class="row"><b>⏰ 시간</b><span id="tTime">-</span></div>
        <div class="row"><b>📍 장소</b><span id="tPlace">-</span></div>
      </div>

      <button class="share-btn" id="shareBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#3c1e00" aria-hidden="true">
          <path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7-.2.7-.7 2.6-.8 3-.1.5.2.5.4.4.2-.1 2.6-1.8 3.7-2.5.7.1 1.4.1 2 .1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/>
        </svg>
        카카오톡으로 공유하기
      </button>
      <button class="btn-ghost" id="restartBtn">처음부터 다시 하기 ↺</button>
      <p class="fine" id="fineNote"></p>
    </section>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* =========================================================================
   ⚙️ 설정 (여기만 바꾸면 됩니다)
   ========================================================================= */
const CONFIG = {
  question:  "우리… 데이트 할래?",   // 첫 화면 질문
  fromName:  "",                     // 보내는 사람 이름 (공유 메시지에 들어감, 비워도 됨)
  // 카카오톡 "직접" 공유를 켜려면 아래에 카카오 JavaScript 앱키를 넣으세요.
  // https://developers.kakao.com → 내 애플리케이션 → 앱 키 → JavaScript 키
  // 비워두면 모바일 기본 공유(카카오톡 포함)로 동작합니다.
  kakaoJsKey: "",
  maxDodges: 4                        // NO 버튼이 이 횟수만큼 도망친 뒤 '타노스 소멸'
};

/* =========================================================================
   유틸
   ========================================================================= */
const $ = (sel) => document.querySelector(sel);
const WEEK = ['일','월','화','수','목','금','토'];

// 화면 전환
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('#'+id).classList.add('active');
}

// 토스트 알림
let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* =========================================================================
   배경 하트 생성
   ========================================================================= */
(function makeHearts(){
  const box = $('#hearts');
  const chars = ['💗','💕','💖','❤️','💞','🩷'];
  for(let i=0;i<14;i++){
    const s = document.createElement('span');
    s.textContent = chars[i % chars.length];
    s.style.left = Math.random()*100 + 'vw';
    s.style.fontSize = (16 + Math.random()*22) + 'px';
    s.style.animationDuration = (7 + Math.random()*8) + 's';
    s.style.animationDelay = (Math.random()*8) + 's';
    box.appendChild(s);
  }
})();

/* =========================================================================
   효과음 (Web Audio — 외부 파일 없이 브라우저에서 소리를 직접 합성)
   ========================================================================= */
let audioCtx = null;
function actx(){
  // AudioContext : 웹 오디오의 시작점. 사용자 입력(클릭/터치) 후에만 소리 재생 허용됨(자동재생 정책)
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// 첫 실제 입력에서 오디오 잠금 해제 (once: 한 번 실행 후 리스너 자동 제거)
window.addEventListener('pointerdown', actx, { once: true });

// 주파수 f1→f2로 미끄러지는 짧은 톤 하나 재생
function tone(f1, f2, dur, type, vol, delay){
  const ac = actx();
  if(ac.state !== 'running') return;   // 아직 잠금 해제 전이면 조용히 스킵 (몰아서 터지는 것 방지)
  const t0 = ac.currentTime + (delay || 0);
  const o = ac.createOscillator();     // 오실레이터: 지정한 파형(sine 등)의 원시 소리 생성
  const g = ac.createGain();           // 게인: 볼륨 조절 노드
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f1, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t0 + dur);  // 주파수를 곡선으로 슬라이드
  g.gain.setValueAtTime(vol || 0.15, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);                 // 볼륨 페이드아웃(뚝 끊김 방지)
  o.connect(g).connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

const sfx = {
  // 도망: 뿅! (도망 횟수 n이 올라갈수록 음이 높아져 점점 다급한 느낌)
  pop(n){ tone(380 + n*70, 800 + n*90, 0.09, 'square', 0.07); },
  // 되묻기 진입: 어…? (올라가는 의문형 톤)
  huh(){ tone(480, 900, 0.2, 'sine', 0.12); },
  // 거절: 뚜-웅 (내려가는 시무룩 두 음)
  sad(){ tone(520, 330, 0.28, 'triangle', 0.12); tone(420, 230, 0.36, 'triangle', 0.1, 0.22); },
  // 타노스 소멸: 슈욱- (점점 잦아드는 노이즈를 밴드패스 필터로 쓸어내림)
  swoosh(){
    const ac = actx();
    if(ac.state !== 'running') return;
    const t0 = ac.currentTime, len = Math.floor(ac.sampleRate * 0.6);
    const buf = ac.createBuffer(1, len, ac.sampleRate);       // 빈 오디오 버퍼 생성
    const d = buf.getChannelData(0);
    for(let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * (1 - i/len);  // 잦아드는 백색소음
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass';   // 특정 대역만 통과시키는 필터
    f.frequency.setValueAtTime(1800, t0);
    f.frequency.exponentialRampToValueAtTime(220, t0 + 0.6);  // 높은 바람소리 → 낮게 쓸려감
    const g = ac.createGain();
    g.gain.setValueAtTime(0.3, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.6);
    src.connect(f).connect(g).connect(ac.destination);
    src.start(t0);
  },
  // YES/확정: 빰빠밤~ (도–미–솔–도 아르페지오)
  fanfare(){
    [[523,0],[659,0.09],[784,0.18],[1047,0.28]].forEach(([f, w]) => tone(f, f, 0.22, 'triangle', 0.13, w));
  }
};

/* =========================================================================
   우중충 무드 — 거절당할수록 배경이 어두워지고 YES를 누르면 화사하게 회복
   ========================================================================= */
let gloomLevel = 0;
function setGloom(n){
  gloomLevel = Math.max(0, n);
  // 레벨당 9%씩 어두워지고 최대 50%까지 (CSS transition으로 서서히 변함)
  $('#gloom').style.opacity = Math.min(gloomLevel * 0.09, 0.5);
}

/* =========================================================================
   ① 신청 화면 : NO 버튼 도망 + 타노스 소멸
   ========================================================================= */
$('#q-title').textContent = CONFIG.question;

const noBtn  = $('#noBtn');
const yesBtn = $('#yesBtn');
const taunt  = $('#taunt');

let dodgeCount = 0;
let yesScale   = 1;
let noFixed    = false;   // NO 버튼이 아직 flex 흐름 안에 있는지
let mode       = 'ask';   // 'ask' = NO가 도망다니는 모드, 'tease' = "안 튕겨도 되는 거야?" 되묻기 모드
let stayStill  = false;   // tease에서 NO를 누른 직후 잠깐 도망 금지 (그 자리에 머무는 연출)
let teaseCount = 0;       // 되묻기를 몇 번 반복했는지 (멘트 바리에이션용)
let lastDodge  = -9999;   // 마지막 도망 시각 (중복 이벤트 방지용)

// 도망칠 때마다 바뀌는 도발 멘트 (4번째에서 소멸)
const TAUNTS = [
  "못 잡지롱~ 🏃‍♂️💨",
  "어림도 없지! 😜",
  "한 번만 더 생각해봐… 💭",
  "이러다 진짜 사라진다? ✨"
];

// NO가 살아있을 때 YES를 누르면 나오는 되묻기 멘트 (반복할수록 변화)
const TEASE_TITLES = [
  "뭐야…? 안 튕겨도 되는 거야?",

// NO 버튼을 화면 안 임의 위치로 순간이동
function dodge(){
  if(stayStill) return;                 // tease에서 NO 직후엔 잠깐 그 자리에 머무름
  // 한 번의 클릭/탭에도 pointerenter·pointerdown·pointermove가 연달아 들어오므로
  // 450ms 안의 중복 호출은 1회로 취급 → 도망 1번당 멘트도 정확히 1단계씩 진행
  const now = performance.now();
  if(now - lastDodge < 450) return;
  lastDodge = now;
  const pad = 12;
  const bw = noBtn.offsetWidth, bh = noBtn.offsetHeight;

  // 처음 도망칠 땐 현재 위치를 기준으로 fixed 전환 (튀지 않게)
  if(!noFixed){
    const r = noBtn.getBoundingClientRect();
    // 카드(.screen)에 backdrop-filter가 있어 그대로 두면 fixed가 '뷰포트'가 아니라
    // '카드' 기준으로 잡힘 → 화면 밖으로 튐. body로 옮겨서 진짜 뷰포트 기준이 되게 함.
    document.body.appendChild(noBtn);
    noBtn.style.position = 'fixed';
    noBtn.style.zIndex = '9990';   // 카드(.stage z-index:1)보다 항상 위 → 뒤에 숨지 않음
    noBtn.style.left = r.left + 'px';
    noBtn.style.top  = r.top  + 'px';
    noBtn.style.margin = '0';
    noFixed = true;
  }

  // 모바일 주소창/키보드를 제외한 '실제로 보이는' 영역 기준으로 착지
  // visualViewport : 핀치 줌·주소창 등을 반영한 현재 가시 영역 (없으면 innerWidth/Height)
  const vp = window.visualViewport;
  const winW = vp ? vp.width  : window.innerWidth;
  const winH = vp ? vp.height : window.innerHeight;
  const offX = vp ? vp.offsetLeft : 0;
  const offY = vp ? vp.offsetTop  : 0;

  // YES 버튼 + 가운데 카드 영역을 피해서 착지 (카드 뒤로 숨어 안 보이는 문제 방지)
  const yr = yesBtn.getBoundingClientRect();
  const cardEl = document.querySelector('.screen.active');
  const cr = cardEl ? cardEl.getBoundingClientRect() : null;
  let nx, ny, tries = 0, clear = false;
  // 후보 좌표(nx,ny)가 사각형 r과 겹치는지 검사 (m = 여유 간격)
  const overlaps = (r, m) => nx < r.right + m && nx + bw > r.left - m &&
                             ny < r.bottom + m && ny + bh > r.top - m;
  do{
    nx = offX + pad + Math.random() * (winW - bw - pad*2);
    ny = offY + pad + Math.random() * (winH - bh - pad*2);
    clear = !overlaps(yr, 20) && !(cr && overlaps(cr, 12));
    tries++;
  } while(tries < 60 && !clear);
  // 화면이 아주 작아 60번 안에 빈자리를 못 찾으면 카드 위라도 착지 — z-index 덕에 항상 보임

  noBtn.style.left = nx + 'px';
  noBtn.style.top  = ny + 'px';

  // 도발 멘트 + 단계별 우는 이모지 + YES 버튼은 점점 커지고 NO는 살짝 작아짐
  taunt.textContent = TAUNTS[Math.min(dodgeCount, TAUNTS.length-1)];
  setAskEmoji(TAUNT_IMGS[Math.min(dodgeCount, TAUNT_IMGS.length-1)]);
  sfx.pop(dodgeCount);              // 뿅! (도망칠수록 음이 높아짐)
  setGloom(gloomLevel + 1);         // 조금씩 우중충해짐
  taunt.style.color = '#ff3d6e';
  yesScale = Math.min(yesScale + 0.14, 2.1);
  yesBtn.style.transform = `scale(${yesScale})`;
  noBtn.style.transform  = `scale(${Math.max(1 - dodgeCount*0.08, 0.55)})`;

  dodgeCount++;

  // 정해진 횟수를 넘기면 타노스처럼 소멸 ✨ — 질문도 '마지막 신청' 버전으로
  if(dodgeCount >= CONFIG.maxDodges){
    $('#q-title').textContent = "이제 거절 할 버튼도 없어…! 우리 데이트 할래?";
    taunt.textContent = "결국 이렇게 됐네… 엉엉 그치만 이제 YES뿐이야!!!";
    sfx.swoosh();                   // 슈욱- 하고 흩어지는 소리
    setGloom(gloomLevel + 2);       // 소멸의 순간, 가장 우중충
    thanosSnap(noBtn);
  }
}

// ask 모드에서만 도망감 (tease 모드에선 NO가 얌전히 클릭을 받아줌)
noBtn.addEventListener('pointerenter', () => { if(mode === 'ask') dodge(); });
noBtn.addEventListener('pointerdown', (e) => {

});

noBtn.addEventListener('click', () => { if(mode === 'tease') teaseReject(); });
// 마우스가 버튼 근처(반경 안)로 접근만 해도 미리 피함
window.addEventListener('pointermove', (e) => {
  if(mode !== 'ask' || !noBtn.isConnected) return;  // tease 중이거나 이미 소멸했으면 무시
  if(!noFixed && dodgeCount === 0) return;      // 아직 한 번도 안 움직였으면 pointerenter에 맡김
  if(dodgeCount >= CONFIG.maxDodges) return;
  const r = noBtn.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
  if(dist < 90) dodge();
});

/* --- 타노스 손가락 튕기기(입자 소멸) 효과 ---
   버튼 모양을 캔버스에 다시 그린 뒤, 픽셀을 잘게 쪼개 '먼지 입자'로 만들고
   왼쪽부터 순차적으로 위로 흩날리며 사라지게 합니다. (외부 라이브러리 없음) */
function thanosSnap(el){
  const rect = el.getBoundingClientRect();
  const dpr  = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(rect.width));
  const h = Math.max(1, Math.round(rect.height));

  // (1) 버튼 모양을 오프스크린 캔버스에 재현 (둥근 사각형 + 흰 글씨)
  const off = document.createElement('canvas');
  off.width = w*dpr; off.height = h*dpr;
  const octx = off.getContext('2d');
  octx.scale(dpr, dpr);
  const grad = octx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0, '#9aa4b2'); grad.addColorStop(1, '#6b7280');
  roundRect(octx, 0, 0, w, h, h/2); octx.fillStyle = grad; octx.fill();
  octx.fillStyle = '#fff';
  octx.font = '800 18px system-ui, sans-serif';
  octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.fillText(el.textContent.trim() || 'NO', w/2, h/2);

  const src = octx.getImageData(0, 0, off.width, off.height).data;
  // getImageData : 캔버스 픽셀의 RGBA 배열을 읽어옴 → 입자 색/투명도로 사용

  // (2) 화면에 겹쳐 그릴 캔버스
  const cv = document.createElement('canvas');
  cv.width = off.width; cv.height = off.height;
  Object.assign(cv.style, {
    position:'fixed', left:rect.left+'px', top:rect.top+'px',
    width:w+'px', height:h+'px', pointerEvents:'none', zIndex:9999
  });
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  el.remove();  // 실제 NO 버튼 제거

  // (3) 픽셀을 샘플링해 입자 생성
  const gap = 2 * dpr;
  const parts = [];
  for(let y=0; y<off.height; y+=gap){
    for(let x=0; x<off.width; x+=gap){
      const a = src[(y*off.width + x)*4 + 3];
      if(a > 20){
        parts.push({
          x, y, ox:x, oy:y,
          r:src[(y*off.width+x)*4], g:src[(y*off.width+x)*4+1], b:src[(y*off.width+x)*4+2],
          a: a/255,
          vx: (0.6 + Math.random()*1.6) * dpr,   // 오른쪽으로 흩날림
          vy: -(0.1 + Math.random()*0.6) * dpr,  // 살짝 위로
          delay: (x / off.width) * 26,           // 왼쪽 픽셀부터 먼저 소멸(쓸려가는 느낌)
          life: 1
        });
      }
    }
  }

  // (4) 애니메이션 루프
  let frame = 0;
  (function tick(){
    frame++;
    ctx.clearRect(0, 0, cv.width, cv.height);
    let alive = false;
    for(const p of parts){
      if(frame < p.delay){                 // 아직 소멸 전 → 그대로 그림
        ctx.globalAlpha = p.a;
        ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
        ctx.fillRect(p.x, p.y, gap, gap);
        alive = true; continue;
      }
      p.life -= 0.022;
      if(p.life <= 0) continue;
      alive = true;
      p.x += p.vx + Math.sin((frame + p.oy) * 0.05) * 0.6 * dpr; // 흔들리며 날아감
      p.y += p.vy; p.vy -= 0.02 * dpr;      // 점점 더 위로 떠오름
      ctx.globalAlpha = Math.max(0, p.life) * p.a;
      ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
      const s = gap * p.life;               // 사라지며 작아짐
      ctx.fillRect(p.x, p.y, s, s);
    }
    // requestAnimationFrame : 브라우저 리페인트 타이밍에 맞춰 부드럽게 반복
    if(alive && frame < 220) requestAnimationFrame(tick);
    else cv.remove();
  })();
}

// 캔버스 둥근 사각형 헬퍼
function roundRect(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}

// YES 클릭:
//  - NO가 아직 살아있으면 → "안 튕겨도 되는 거야?" 되물어봄 (tease 모드)
//  - NO가 이미 소멸했거나, tease에서 한 번 더 YES → 진짜 날짜 화면으로
yesBtn.addEventListener('click', () => {
  if(mode === 'ask' && noBtn.isConnected){
    enterTease();
    return;
  }
  sfx.fanfare();      // 빰빠밤~ 🎉
  setGloom(0);        // 우중충했던 배경이 서서히 화사하게 회복
  burst();
  showScreen('screen-date');
});

// "안 튕겨도 되는 거야?" 모드 진입
// 도망다니던 NO를 원래 자리(YES 옆)로 복귀시켜 정상 버튼처럼 다시 보여줌
function enterTease(){
  mode = 'tease';
  sfx.huh();          // 어…?
  // 회차별 능청스러운 REJECT 이미지로 교체
  setAskEmoji(REJECT_IMGS[Math.min(teaseCount, REJECT_IMGS.length-1)]);
  $('#q-title').textContent = TEASE_TITLES[Math.min(teaseCount, TEASE_TITLES.length-1)];
  taunt.textContent = '진심이면 YES 한 번 더! (이번엔 NO 안 도망감 🤞)';
  taunt.style.color = '#b04a68';
  // removeAttribute('style') : fixed 위치/크기 변형 등 인라인 스타일 전부 제거 → flex 흐름 복귀
  noBtn.removeAttribute('style');
  document.querySelector('#askRow').appendChild(noBtn);
  noFixed = false;
  // 커져있던 YES는 레이아웃을 가리지 않게 살짝만 큰 상태로
  yesScale = 1.15;
  yesBtn.style.transform = 'scale(1.15)';
}

// tease에서 NO를 누르면 → 데이트 신청 질문으로 복귀
// NO 버튼은 '방금 누른 그 자리 그대로' 남고, 잠시 후 다시 도망 모드가 됨
function teaseReject(){
  mode = 'ask';
  sfx.sad();                    // 뚜-웅…
  setGloom(gloomLevel + 2);     // 거절은 도망보다 두 배로 우중충
  // 도망 중이던 우는 표정으로 복귀 (아직 한 번도 안 도망갔으면 기본 🥺)
  setAskEmoji(dodgeCount > 0 ? TAUNT_IMGS[Math.min(dodgeCount-1, TAUNT_IMGS.length-1)] : null);
  // 거절 횟수에 따라 점점 애절한 질문으로 (처음 질문 그대로가 아니라)
  $('#q-title').textContent = ASK_AGAIN_TITLES[Math.min(teaseCount, ASK_AGAIN_TITLES.length-1)];
  taunt.textContent = REJECT_SUBS[Math.min(teaseCount, REJECT_SUBS.length-1)];
  taunt.style.color = '#ff3d6e';
  teaseCount++;
  stayStill = true;                     // 바로 도망가지 않고 그 자리에 잠깐 머무는 연출
  setTimeout(() => { stayStill = false; }, 900);
}

/* =========================================================================
   ② 날짜/장소 선택
   ========================================================================= */
const dateInput  = $('#dateInput');
const timeInput  = $('#timeInput');
const placeInput = $('#placeInput');

// yyyy-mm-dd 문자열 (로컬 기준)
function ymd(d){
  const p = (n) => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
// 다가오는 토요일 구하기 (weeksAhead=1 이면 그 다음 주말)
function nextSaturday(weeksAhead){
  const d = new Date();
  const add = (6 - d.getDay() + 7) % 7 || 7;   // 오늘이 토요일이면 다음 토요일
  d.setDate(d.getDate() + add + (weeksAhead * 7));
  return d;
}

// 날짜 칩
$('#dateChips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip'); if(!chip) return;
  setActive('#dateChips', chip);
  const key = chip.dataset.day;
  let d;
  if(key === '0') d = new Date();
  else if(key === 'sat')  d = nextSaturday(0);
  else if(key === 'sat2') d = nextSaturday(1);
  dateInput.value = ymd(d);
});
// 시간 칩
$('#timeChips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip'); if(!chip) return;
  setActive('#timeChips', chip);
  timeInput.value = chip.dataset.time;
});
// 장소 칩
$('#placeChips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip'); if(!chip) return;
  setActive('#placeChips', chip);
  placeInput.value = chip.dataset.place;
});
placeInput.addEventListener('input', () => {
  document.querySelectorAll('#placeChips .chip').forEach(c => c.classList.remove('on'));
});

// 같은 그룹에서 하나만 선택 표시
function setActive(groupSel, chip){
  document.querySelectorAll(groupSel + ' .chip').forEach(c => c.classList.remove('on'));
  chip.classList.add('on');
}

// 확정 → 완료 화면
$('#confirmBtn').addEventListener('click', () => {
  if(!dateInput.value){ toast('데이트 날짜를 골라줘! 📅'); return; }
  if(!timeInput.value){ toast('만날 시간도 정해줘! ⏰'); return; }
  const place = placeInput.value.trim() || '어디든 너랑 함께면 OK 💕';

  $('#tDate').textContent  = fmtDate(dateInput.value);
  $('#tTime').textContent  = fmtTime(timeInput.value);
  $('#tPlace').textContent = place;

  sfx.fanfare();   // 확정 팡파레 🎉
  showScreen('screen-done');
  burst();
});

// "2026-08-15" → "2026년 8월 15일 (토)"
function fmtDate(s){
  const [y,m,d] = s.split('-').map(Number);
  const wd = WEEK[new Date(y, m-1, d).getDay()];
  return `${y}년 ${m}월 ${d}일 (${wd})`;
}
// "18:30" → "오후 6시 30분"
function fmtTime(s){
  let [h,mm] = s.split(':').map(Number);
  const ap = h < 12 ? '오전' : '오후';
  const h12 = (h % 12) || 12;
  return mm ? `${ap} ${h12}시 ${mm}분` : `${ap} ${h12}시`;
}

   ========================================================================= */
function buildMessage(){
  const who = CONFIG.fromName ? `${CONFIG.fromName}와(과) ` : '';
  return [
    '💌 우리 데이트 확정!',
    `📅 ${$('#tDate').textContent}`,
    `⏰ ${$('#tTime').textContent}`,
    `📍 ${$('#tPlace').textContent}`,
    '',
    `${who}이 날 만나요! 🥰`
  ].join('\n');
}

// 카카오 SDK 동적 로드 (앱키가 있을 때만)
function loadKakao(){
  return new Promise((resolve, reject) => {
    if(window.Kakao) return resolve(window.Kakao);
    const sc = document.createElement('script');
    sc.src = 'https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js';
    sc.integrity = 'sha384-TiCUE00h649CAMonG018J2ujOgDKW/kVWlChEuu4jK2vxfAAD0eZxzCKakxg55G4';
    sc.crossOrigin = 'anonymous';
    sc.onload = () => resolve(window.Kakao);
    sc.onerror = reject;
    document.head.appendChild(sc);
  });
}

async function shareToKakao(){
  const msg = buildMessage();

  // 1순위) 카카오 앱키가 설정돼 있으면 → 카카오톡 공유 템플릿으로 직접 전송
  if(CONFIG.kakaoJsKey){
    try{
      const Kakao = await loadKakao();
      if(!Kakao.isInitialized()) Kakao.init(CONFIG.kakaoJsKey);
      Kakao.Share.sendDefault({
        objectType: 'text',
        text: msg,
        link: { mobileWebUrl: location.href, webUrl: location.href }
      });
      return;
    }catch(err){ /* 실패 시 아래 단계로 폴백 */ }
  }

  // 2순위) 모바일 기본 공유 시트 (카카오톡/문자/인스타 등 선택 가능)
  if(navigator.share){
    try{
      await navigator.share({ title: '데이트 신청 💌', text: msg, url: location.href });
      return;
    }catch(err){ if(err && err.name === 'AbortError') return; }
  }

  // 3순위) 클립보드 복사 (PC 등 공유 미지원 환경)
  try{
    await navigator.clipboard.writeText(msg);
    toast('메시지를 복사했어요! 카카오톡에 붙여넣기 하세요 💌');
  }catch{
    toast('아래 내용을 복사해서 카카오톡으로 보내세요 💌\n\n' + msg);
  }
}
$('#shareBtn').addEventListener('click', shareToKakao);

// 안내 문구: 환경에 따라 어떤 방식으로 공유되는지 살짝 알려줌
$('#fineNote').textContent = CONFIG.kakaoJsKey
  ? '카카오톡으로 바로 공유돼요 💛'
  : (navigator.share ? '공유 버튼을 누르면 카카오톡을 선택할 수 있어요 💛'
                     : '버튼을 누르면 메시지가 복사돼요. 카카오톡에 붙여넣기! 💛');

// 다시 하기
$('#restartBtn').addEventListener('click', () => location.reload());

/* =========================================================================
   하트 폭죽 (YES/확정 시)
   ========================================================================= */
function burst(){
  const emojis = ['💖','💕','🎉','✨','💗','🥰'];
  for(let i=0;i<26;i++){
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    Object.assign(s.style, {
      position:'fixed', left:'50%', top:'42%', zIndex:9998,
      fontSize:(18+Math.random()*20)+'px', pointerEvents:'none', willChange:'transform,opacity'
    });
    document.body.appendChild(s);
    const ang = Math.random()*Math.PI*2;
    const dist = 120 + Math.random()*180;
    const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 60;
    // Web Animations API : JS로 키프레임 애니메이션 실행
    s.animate(
      [ { transform:'translate(-50%,-50%) scale(.4)', opacity:1 },
        { transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.2) rotate(${Math.random()*360}deg)`, opacity:0 } ],
      { duration: 900 + Math.random()*500, easing:'cubic-bezier(.15,.7,.3,1)' }
    ).onfinish = () => s.remove();
  }
}
